<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F1F3F6">
<link rel="apple-touch-icon" href="/ekatalox-logo-v2.png">
<title>Tekel Saha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface2:#E8ECF1; --line:#D5DBE3;
  --ink:#141C2B; --ink2:#4B5567; --ink3:#7C8595;
  --accent:#1F4E9A; --accent-ink:#FFFFFF;
  --pos:#1C7F52; --pos-bg:#DFF3E8; --neg:#B83A2A; --neg-bg:#F9E3DF; --vis:#5B6475; --vis-bg:#E6E9EE;
  --shadow:0 1px 2px rgba(20,28,43,.06);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#171E29; --surface2:#1F2835; --line:#2B3543;
  --ink:#E7EBF1; --ink2:#AAB3C1; --ink3:#7A8494;
  --accent:#6FA0EE; --accent-ink:#0B1220;
  --pos:#5CCB93; --pos-bg:#153826; --neg:#F08A7B; --neg-bg:#42201B; --vis:#A3ACBA; --vis-bg:#252E3B;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#171E29; --surface2:#1F2835; --line:#2B3543;
  --ink:#E7EBF1; --ink2:#AAB3C1; --ink3:#7A8494;
  --accent:#6FA0EE; --accent-ink:#0B1220;
  --pos:#5CCB93; --pos-bg:#153826; --neg:#F08A7B; --neg-bg:#42201B; --vis:#A3ACBA; --vis-bg:#252E3B;
  --shadow:none;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:54px}
.hdr h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-wrap:balance}
.hdr .sub{font-size:12px;color:var(--ink3);font-weight:400;display:block}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--accent);font-size:22px;line-height:1}
.back:hover,.back:focus-visible{background:var(--surface2)}
.tabs{display:flex;gap:6px;padding:10px 16px 0;max-width:720px;margin:0 auto}
.tab{flex:1;padding:9px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:500;color:var(--ink2);text-align:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding:12px 16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ilce{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;width:100%;text-align:left}
.ilce .nm{font-weight:600;font-size:16px}
.ilce .cnt{font-family:var(--mono);font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ilce .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:6px;display:flex}
.ilce .bar i{display:block;height:100%}
.ilce .bar .p{background:var(--pos)} .ilce .bar .n{background:var(--neg)} .ilce .bar .v{background:var(--vis)}
.ilce .stat{grid-column:1/-1;font-size:12px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap}
.dealer{padding:12px 14px}
.dealer .top{display:flex;gap:10px;align-items:flex-start}
.dealer .nm{font-weight:600;font-size:15.5px;flex:1;min-width:0;overflow-wrap:anywhere}
.dealer .meta{font-size:12.5px;color:var(--ink3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.dealer .dist{font-family:var(--mono);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.olumlu{background:var(--pos-bg);color:var(--pos)} .badge.olumsuz{background:var(--neg-bg);color:var(--neg)} .badge.gidildi{background:var(--vis-bg);color:var(--vis)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts a,.acts span{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:9px;border:1px solid var(--line);font-weight:500;text-decoration:none;color:var(--ink);background:var(--surface2)}
.acts .go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts .tel{font-family:var(--mono);font-variant-numeric:tabular-nums}
.acts .tel.none{color:var(--ink3)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.st button{padding:9px 6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.st button[data-k="gidildi"][aria-pressed="true"]{background:var(--vis-bg);border-color:var(--vis);color:var(--vis)}
.st button[data-k="olumlu"][aria-pressed="true"]{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}
.st button[data-k="olumsuz"][aria-pressed="true"]{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
.note{margin-top:8px;display:flex;gap:8px}
.note input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.note input:focus{outline:2px solid var(--accent);outline-offset:1px}
.note .when{font-size:11.5px;color:var(--ink3);align-self:center;white-space:nowrap;font-family:var(--mono)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--ink3);text-align:center;padding:40px 16px}
.grp{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 2px 6px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:22px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.sum span{font-size:12px;color:var(--ink3)}
.sum .p b{color:var(--pos)} .sum .n b{color:var(--neg)}
.sync{font-size:11.5px;color:var(--ink3);padding:0 2px 8px;font-family:var(--mono)}
.sync.err{color:var(--neg)}
.more{margin:12px auto 0;display:block;padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="hdr">
  <button class="back" id="back" hidden aria-label="Geri">‹</button>
  <h1 id="title">Tekel Saha<span class="sub" id="subtitle">İstanbul · 39 ilçe</span></h1>
</header>
<div class="tabs" id="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-ilceler" aria-selected="true">İlçeler</button>
  <button class="tab" role="tab" id="tab-ziyaretler" aria-selected="false">Ziyaretler</button>
</div>
<main>
  <div class="sync" id="sync">kayıtlar yükleniyor…</div>
  <div id="view"></div>
</main>

<script src="/saha/tk-llt6yveiiqsapk1mma/data.js"></script>
<script>
(function(){
  const DATA = window.TEKEL_DATA || [];
  const $ = (s,el=document)=>el.querySelector(s);
  const view = $('#view'), title=$('#title'), subtitle=$('#subtitle'), back=$('#back'), syncEl=$('#sync');
  const byIlce = Object.fromEntries(DATA.map(d=>[d.s,d]));
  const dealerIndex = {}; DATA.forEach(d=>d.k.forEach(k=>dealerIndex[k.i]={...k,ilce:d.s,ilceAd:d.n}));

  // ---- state: {ilceSlug: {dealerId: {d,n,t}}}
  let visits = {};
  const LS='tekel-saha-v1';
  try{ visits = JSON.parse(localStorage.getItem(LS)||'{}') || {}; }catch(e){ visits={}; }
  function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(visits)); }catch(e){} }

  const route = { tab:'ilceler', ilce:null, q:'', sort:'ad', filter:'hepsi', vf:'hepsi' };
  let myPos = null;

  function setSync(t,err){ syncEl.textContent=t; syncEl.classList.toggle('err',!!err); }

  // ---- sync: /api/saha/<token> (Supabase). localStorage çevrimdışı yedek.
  const API='/api/saha/tk-llt6yveiiqsapk1mma';
  let online=false;
  async function pull(){
    try{
      const r=await fetch(API,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); const merged={};
      for(const il in (j.ziyaret||{})) merged[il]={...j.ziyaret[il]};
      // cihazda olup sunucuda olmayanları (çevrimdışı işaretler) geri yükle
      const pendingIl=new Set();
      for(const il in visits){ if(!merged[il]) merged[il]={}; for(const id in visits[il]){ if(!merged[il][id]){ merged[il][id]=visits[il][id]; pendingIl.add(il);} } }
      visits=merged; online=true; saveLocal();
      setSync('kayıtlar bulutta · '+countAll()+' işaretli bayi');
      pendingIl.forEach(il=>persist(il));
      render();
    }catch(e){ online=false; setSync('bulut bağlantısı yok, cihazda kaydediliyor', true); render(); }
  }
  pull();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); });

  const writeTimers = {};
  function persist(ilce){
    saveLocal();
    clearTimeout(writeTimers[ilce]);
    writeTimers[ilce] = setTimeout(async ()=>{
      try{
        const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ilce,kayitlar:visits[ilce]||{}})});
        if(!r.ok) throw new Error('HTTP '+r.status);
        online=true; setSync('kayıtlar bulutta · '+countAll()+' işaretli bayi');
      }catch(e){ online=false; setSync('kayıt buluta yazılamadı · cihazda duruyor, bağlanınca gönderilir', true); }
    }, 600);
  }

  function countAll(){ let c=0; for(const il in visits) c+=Object.keys(visits[il]).length; return c; }
  function stats(ilce){ const v=visits[ilce]||{}; const s={olumlu:0,olumsuz:0,gidildi:0}; for(const id in v){ if(s[v[id].d]!=null) s[v[id].d]++; } return s; }

  function setStatus(ilce,id,k){
    if(!ilce) return;
    visits[ilce] = visits[ilce]||{};
    const cur = visits[ilce][id];
    if(cur && cur.d===k){ delete visits[ilce][id]; }
    else { visits[ilce][id] = { d:k, n:(cur&&cur.n)||'', t:new Date().toISOString() }; }
    persist(ilce); render();
  }
  function setNote(ilce,id,n){
    if(!ilce) return;
    visits[ilce] = visits[ilce]||{};
    const cur = visits[ilce][id] || { d:'gidildi', t:new Date().toISOString() };
    cur.n = n; visits[ilce][id]=cur; persist(ilce);
  }

  // ---- helpers
  const esc = s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const mapsUrl = k=>'https://www.google.com/maps/dir/?api=1&destination='+k.la+','+k.ln+'&travelmode=walking';
  const telHref = p=>{ const d=String(p||'').replace(/\D/g,''); return d? 'tel:+90'+d.replace(/^0/,'') : ''; };
  function dist(a,b){ const R=6371000,toR=Math.PI/180; const dLa=(b.la-a.la)*toR, dLn=(b.ln-a.ln)*toR; const h=Math.sin(dLa/2)**2+Math.cos(a.la*toR)*Math.cos(b.la*toR)*Math.sin(dLn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
  const fmtDist = m=> m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(1)+' km';
  const fmtWhen = t=>{ try{ const d=new Date(t); return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
  const norm = s=>String(s||'').toLocaleLowerCase('tr-TR');
  const LABEL={gidildi:'Gidildi',olumlu:'Olumlu',olumsuz:'Olumsuz'};

  // ---- rendering
  function render(){
    back.hidden = !(route.tab==='ilceler' && route.ilce);
    if(route.tab==='ilceler' && !route.ilce) renderIlceler();
    else if(route.tab==='ilceler') renderIlce(route.ilce);
    else renderZiyaretler();
    $('#tab-ilceler').setAttribute('aria-selected', route.tab==='ilceler');
    $('#tab-ziyaretler').setAttribute('aria-selected', route.tab==='ziyaretler');
  }

  function focusEnd(id){ const i=$('#'+id); if(!i) return; i.focus(); const n=i.value.length; try{ i.setSelectionRange(n,n); }catch(e){} }

  function renderIlceler(){
    title.firstChild.nodeValue='Tekel Saha'; subtitle.textContent='İstanbul · '+DATA.length+' ilçe · '+DATA.reduce((a,d)=>a+d.k.length,0)+' bayi';
    const s={olumlu:0,olumsuz:0,gidildi:0};
    DATA.forEach(d=>{ const st=stats(d.s); s.olumlu+=st.olumlu; s.olumsuz+=st.olumsuz; s.gidildi+=st.gidildi; });
    const all=s.olumlu+s.olumsuz+s.gidildi;
    let h = '<div class="sum"><div><b>'+all+'</b><span>ziyaret</span></div><div class="p"><b>'+s.olumlu+'</b><span>olumlu</span></div><div class="n"><b>'+s.olumsuz+'</b><span>olumsuz</span></div></div>';
    h += '<input class="search" id="q" type="search" placeholder="İlçe ara" value="'+esc(route.q)+'" autocomplete="off">';
    h += '<div class="list">';
    const q=norm(route.q);
    DATA.filter(d=>!q || norm(d.n).includes(q)).forEach(d=>{
      const st=stats(d.s), tot=d.k.length, done=st.olumlu+st.olumsuz+st.gidildi;
      const pct=x=>(100*x/tot).toFixed(1)+'%';
      h += '<div class="row"><button class="ilce" data-ilce="'+d.s+'"><span class="nm">'+esc(d.n)+'</span><span class="cnt">'+done+' / '+tot+'</span>'+
        '<span class="bar"><i class="p" style="width:'+pct(st.olumlu)+'"></i><i class="n" style="width:'+pct(st.olumsuz)+'"></i><i class="v" style="width:'+pct(st.gidildi)+'"></i></span>'+
        (done? '<span class="stat"><span>'+st.olumlu+' olumlu</span><span>'+st.olumsuz+' olumsuz</span><span>'+st.gidildi+' sadece gidildi</span></span>':'')+
        '</button></div>';
    });
    h += '</div>';
    view.innerHTML=h;
    $('#q').addEventListener('input',e=>{ route.q=e.target.value; renderIlceler(); focusEnd('q'); });
    view.querySelectorAll('.ilce').forEach(b=>b.addEventListener('click',()=>{ route.ilce=b.dataset.ilce; route.q=''; shown=80; window.scrollTo(0,0); render(); }));
  }

  let shown = 80;
  function renderIlce(slug){
    const d=byIlce[slug]; if(!d){ route.ilce=null; return renderIlceler(); }
    const st=stats(slug), v=visits[slug]||{};
    title.firstChild.nodeValue=d.n; subtitle.textContent=d.k.length+' bayi · '+st.olumlu+' olumlu · '+st.olumsuz+' olumsuz · '+st.gidildi+' gidildi';
    let h = '<input class="search" id="q" type="search" placeholder="Bayi adı, mahalle veya telefon" value="'+esc(route.q)+'" autocomplete="off">';
    h += '<div class="tools">'+
      '<button class="chip" data-sort="yakin" aria-pressed="'+(route.sort==='yakin')+'">📍 Yakınımdakiler</button>'+
      '<button class="chip" data-filter="hepsi" aria-pressed="'+(route.filter==='hepsi')+'">Hepsi</button>'+
      '<button class="chip" data-filter="gidilmedi" aria-pressed="'+(route.filter==='gidilmedi')+'">Gidilmedi</button>'+
      '<button class="chip" data-filter="isaretli" aria-pressed="'+(route.filter==='isaretli')+'">İşaretli</button>'+
      '</div>';
    const q=norm(route.q), qd=q.replace(/\s/g,'');
    let list = d.k.filter(k=>{
      if(q && !(norm(k.n).includes(q)||norm(k.m).includes(q)||norm(k.a).includes(q)||(qd&&k.p.replace(/\s/g,'').includes(qd)))) return false;
      const rec=v[k.i];
      if(route.filter==='gidilmedi' && rec) return false;
      if(route.filter==='isaretli' && !rec) return false;
      return true;
    });
    if(route.sort==='yakin' && myPos){ list = list.map(k=>({k,dm:dist(myPos,k)})).sort((a,b)=>a.dm-b.dm); }
    else { list = list.map(k=>({k,dm:null})).sort((a,b)=>a.k.m.localeCompare(b.k.m,'tr')||a.k.n.localeCompare(b.k.n,'tr')); }
    h += '<div class="list">';
    if(!list.length) h+='<div class="empty">Eşleşen bayi yok</div>';
    list.slice(0,shown).forEach(({k,dm})=>{ h += dealerRow(k,v[k.i],dm,null); });
    h += '</div>';
    if(list.length>shown) h += '<button class="more" id="more">'+(list.length-shown)+' bayi daha göster</button>';
    view.innerHTML=h;
    bindDealerRows(slug);
    $('#q').addEventListener('input',e=>{ route.q=e.target.value; shown=80; renderIlce(slug); focusEnd('q'); });
    view.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{ route.filter=b.dataset.filter; shown=80; renderIlce(slug); }));
    const yk=$('[data-sort="yakin"]');
    yk.addEventListener('click',()=>{
      if(route.sort==='yakin'){ route.sort='ad'; return renderIlce(slug); }
      if(!navigator.geolocation){ setSync('Bu cihazda konum servisi yok', true); return; }
      yk.textContent='📍 Konum alınıyor…';
      navigator.geolocation.getCurrentPosition(p=>{ myPos={la:p.coords.latitude,ln:p.coords.longitude}; route.sort='yakin'; renderIlce(slug); },
        ()=>{ setSync('Konum izni verilmedi; alfabetik sıralama kullanılıyor', true); renderIlce(slug); }, {enableHighAccuracy:true,timeout:8000,maximumAge:30000});
    });
    const more=$('#more'); if(more) more.addEventListener('click',()=>{ shown+=80; renderIlce(slug); });
  }

  function dealerRow(k,rec,dm,ilceAd){
    const tel=telHref(k.p);
    return '<div class="row dealer" data-id="'+k.i+'">'+
      '<div class="top"><div style="flex:1;min-width:0"><div class="nm">'+esc(k.n)+'</div>'+
      '<div class="meta">'+(ilceAd?'<span>'+esc(ilceAd)+' ·</span>':'')+'<span>'+esc(k.m)+'</span>'+(k.t?'<span>· '+esc(k.t)+'</span>':'')+(dm!=null?'<span class="dist">· '+fmtDist(dm)+'</span>':'')+'</div></div>'+
      (rec?'<span class="badge '+rec.d+'">'+LABEL[rec.d]+'</span>':'')+'</div>'+
      '<div class="acts"><a class="go" href="'+mapsUrl(k)+'" target="_blank" rel="noopener">Konuma git</a>'+
      (tel?'<a class="tel" href="'+tel+'">'+esc(k.p)+'</a>':'<span class="tel none">telefon yok</span>')+'</div>'+
      '<div class="st">'+['gidildi','olumlu','olumsuz'].map(s=>'<button data-k="'+s+'" aria-pressed="'+(!!rec&&rec.d===s)+'">'+LABEL[s]+'</button>').join('')+'</div>'+
      (rec?'<div class="note"><input type="text" id="not-'+k.i+'" placeholder="Not (kim konuştu, ne dedi…)" value="'+esc(rec.n||'')+'" maxlength="200"><span class="when">'+fmtWhen(rec.t)+'</span></div>':'')+
      '</div>';
  }
  function bindDealerRows(slug){
    view.querySelectorAll('.dealer').forEach(row=>{
      const id=row.dataset.id; const il = slug || (dealerIndex[id]&&dealerIndex[id].ilce);
      row.querySelectorAll('.st button').forEach(b=>b.addEventListener('click',()=>setStatus(il,id,b.dataset.k)));
      const inp=row.querySelector('.note input');
      if(inp){ let t; inp.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>setNote(il,id,inp.value.trim()),500); }); }
    });
  }

  function renderZiyaretler(){
    title.firstChild.nodeValue='Ziyaretler';
    const rows=[]; for(const il in visits){ for(const id in visits[il]){ const k=dealerIndex[id]; if(k) rows.push({k,rec:visits[il][id]}); } }
    subtitle.textContent=rows.length+' işaretli bayi';
    let h='<div class="tools">'+['hepsi','olumlu','olumsuz','gidildi'].map(f=>'<button class="chip" data-vf="'+f+'" aria-pressed="'+(route.vf===f)+'">'+(f==='hepsi'?'Hepsi':LABEL[f])+'</button>').join('')+'</div>';
    const list=rows.filter(r=>route.vf==='hepsi'||r.rec.d===route.vf).sort((a,b)=>(b.rec.t||'').localeCompare(a.rec.t||''));
    if(!list.length){ h+='<div class="empty">Henüz işaretli bayi yok. İlçeler sekmesinden bir bayiyi Gidildi / Olumlu / Olumsuz olarak işaretle.</div>'; view.innerHTML=h; bindVf(); return; }
    let lastDay='', open=false;
    list.forEach(r=>{
      const day=(r.rec.t||'').slice(0,10);
      if(day!==lastDay){ lastDay=day; let lbl=day; try{ lbl=new Date(day+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}); }catch(e){} if(open) h+='</div>'; h+='<div class="grp">'+esc(lbl)+'</div><div class="list">'; open=true; }
      h+=dealerRow(r.k,r.rec,null,r.k.ilceAd);
    });
    if(open) h+='</div>';
    view.innerHTML=h; bindDealerRows(null); bindVf();
  }
  function bindVf(){ view.querySelectorAll('[data-vf]').forEach(b=>b.addEventListener('click',()=>{ route.vf=b.dataset.vf; renderZiyaretler(); })); }

  back.addEventListener('click',()=>{ route.ilce=null; route.q=''; route.filter='hepsi'; route.sort='ad'; shown=80; render(); });
  $('#tab-ilceler').addEventListener('click',()=>{ route.tab='ilceler'; render(); });
  $('#tab-ziyaretler').addEventListener('click',()=>{ route.tab='ziyaretler'; render(); });
  render();
})();
</script>
</body>
</html>
