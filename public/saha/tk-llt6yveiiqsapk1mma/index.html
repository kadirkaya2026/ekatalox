<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F1F3F6">
<link rel="apple-touch-icon" href="/ekatalox-logo-v2.png">
<title>Tekel Saha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface2:#E8ECF1; --line:#D5DBE3;
  --ink:#141C2B; --ink2:#4B5567; --ink3:#7C8595;
  --accent:#1F4E9A; --accent-ink:#FFFFFF;
  --pos:#1C7F52; --pos-bg:#DFF3E8; --neg:#B83A2A; --neg-bg:#F9E3DF; --vis:#B7791F; --vis-bg:#FBEFD2;
  --shadow:0 1px 2px rgba(20,28,43,.06);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#171E29; --surface2:#1F2835; --line:#2B3543;
  --ink:#E7EBF1; --ink2:#AAB3C1; --ink3:#7A8494;
  --accent:#6FA0EE; --accent-ink:#0B1220;
  --pos:#5CCB93; --pos-bg:#153826; --neg:#F08A7B; --neg-bg:#42201B; --vis:#F2B94B; --vis-bg:#3D2E10;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#171E29; --surface2:#1F2835; --line:#2B3543;
  --ink:#E7EBF1; --ink2:#AAB3C1; --ink3:#7A8494;
  --accent:#6FA0EE; --accent-ink:#0B1220;
  --pos:#5CCB93; --pos-bg:#153826; --neg:#F08A7B; --neg-bg:#42201B; --vis:#F2B94B; --vis-bg:#3D2E10;
  --shadow:none;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:54px}
.hdr h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-wrap:balance}
.hdr .sub{font-size:12px;color:var(--ink3);font-weight:400;display:block}
.back{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--accent);font-size:22px;line-height:1}
.back:hover,.back:focus-visible{background:var(--surface2)}
.tabs{display:flex;gap:6px;padding:10px 16px 0;max-width:720px;margin:0 auto}
.tab{flex:1;padding:9px 6px;font-size:13.5px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:500;color:var(--ink2);text-align:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding:12px 16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ilce{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;width:100%;text-align:left}
.ilce .nm{font-weight:600;font-size:16px}
.ilce .cnt{font-family:var(--mono);font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ilce .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:6px;display:flex}
.ilce .bar i{display:block;height:100%}
.ilce .bar .p{background:var(--pos)} .ilce .bar .n{background:var(--neg)} .ilce .bar .v{background:var(--vis)}
.ilce .stat{grid-column:1/-1;font-size:12px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap}
.dealer{padding:12px 14px}
.dealer .top{display:flex;gap:10px;align-items:flex-start}
.dealer .nm{font-weight:600;font-size:15.5px;flex:1;min-width:0;overflow-wrap:anywhere}
.dealer .meta{font-size:12.5px;color:var(--ink3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.dealer .dist{font-family:var(--mono);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.olumlu{background:var(--pos-bg);color:var(--pos)} .badge.olumsuz{background:var(--neg-bg);color:var(--neg)} .badge.gidildi{background:var(--vis-bg);color:var(--vis)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts a,.acts span{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:9px;border:1px solid var(--line);font-weight:500;text-decoration:none;color:var(--ink);background:var(--surface2)}
.acts .go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts .tel{font-family:var(--mono);font-variant-numeric:tabular-nums}
.acts .tel.none{color:var(--ink3)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.st.one{grid-template-columns:1fr}
.row.visited{background:var(--vis-bg);border-color:var(--vis);border-left:5px solid var(--vis)}
.row.visited.olumlu{background:var(--pos-bg);border-color:var(--pos);border-left-color:var(--pos)}
.row.visited.olumsuz{background:var(--neg-bg);border-color:var(--neg);border-left-color:var(--neg)}
.row.visited .st button,.row.visited .acts .tel,.row.visited .note textarea{background:var(--surface)}
.undo{margin-top:8px;font-size:12.5px;color:var(--ink3);text-decoration:underline;text-underline-offset:2px;justify-self:start}
.st button{padding:9px 6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.st button[data-k="gidildi"][aria-pressed="true"]{background:var(--vis-bg);border-color:var(--vis);color:var(--vis)}
.st button[data-k="olumlu"][aria-pressed="true"]{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}
.st button[data-k="olumsuz"][aria-pressed="true"]{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
.note{margin-top:10px;background:var(--surface2);border-radius:10px;padding:10px}
.note label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.note textarea{width:100%;min-height:64px;resize:vertical;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;line-height:1.4}
.note textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.note .nrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.note .save{padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13.5px}
.note .save[disabled]{opacity:.55}
.note .when{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-family:var(--mono);margin-left:auto}
.note .saved{font-size:12.5px;color:var(--pos);font-weight:600}
.quote{margin-top:8px;padding:8px 10px;border-left:3px solid var(--line);color:var(--ink2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink2)}
.chip.near{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:100%;justify-content:center;display:flex;padding:11px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--ink3);text-align:center;padding:40px 16px}
.grp{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 2px 6px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:22px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.sum span{font-size:12px;color:var(--ink3)}
.sum .p b{color:var(--pos)} .sum .n b{color:var(--neg)}
.sync{font-size:11.5px;color:var(--ink3);padding:0 2px 8px;font-family:var(--mono)}
.sync.err{color:var(--neg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg button{padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.step h3{margin:0 0 4px;font-size:15.5px;display:flex;gap:10px;align-items:baseline}
.step h3 .n{font-family:var(--mono);font-size:12px;color:var(--ink3);font-weight:500}
.step .aim{font-size:12.5px;color:var(--ink3);margin-bottom:10px}
.say{border-left:3px solid var(--accent);padding:8px 10px;margin:8px 0;background:var(--surface2);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.45}
.say b{color:var(--accent);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.tip{font-size:13px;color:var(--ink2);margin:6px 0 0;padding-left:16px}
.tip li{margin:3px 0}
details.obj{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
details.obj summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary::after{content:"+";color:var(--ink3);font-family:var(--mono)}
details.obj[open] summary::after{content:"–"}
details.obj .body{padding:0 14px 12px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.warn{background:var(--neg-bg);color:var(--neg);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.who{font-size:12px;color:var(--ink3);padding:6px 0 0;display:flex;gap:8px;align-items:center;justify-content:space-between}
.who button{color:var(--accent);font-weight:600;font-size:12.5px}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{background:var(--surface);border-radius:14px;padding:18px;width:100%;max-width:380px}
.modal h2{margin:0 0 6px;font-size:17px}.modal p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.modal input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.modal .ok{margin-top:10px;width:100%;padding:11px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.media{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.media button,.media label{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px;cursor:pointer;text-align:center}
.media label input{display:none}
.media .rec{border-color:var(--neg);color:var(--neg)}
.media .rec.on{background:var(--neg);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.media .rec.on{animation:none}}
.consent{margin-top:8px;background:var(--surface2);border-radius:10px;padding:10px;font-size:13.5px}
.consent label{display:flex;gap:8px;align-items:flex-start}
.consent input{margin-top:3px;width:18px;height:18px}
.consent .go{margin-top:8px;padding:9px 12px;border-radius:8px;background:var(--neg);color:#fff;font-weight:600}
.consent .go[disabled]{opacity:.45}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.audios{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.audios div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.audios audio{height:34px;flex:1;min-width:0}
.flag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--neg-bg);color:var(--neg)}
.flag.ok{background:var(--pos-bg);color:var(--pos)}
.sebep{margin-top:8px}
.sebep select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.up{font-size:12px;color:var(--ink3);margin-top:6px}
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.login h2{margin:0 0 4px;font-size:18px}.login p{margin:0 0 14px;color:var(--ink3);font-size:13.5px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.login .ok{margin-top:10px;width:100%;padding:12px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.login .err{color:var(--neg);font-size:13px;margin-top:8px;min-height:18px}
.adm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.adm h3{margin:0 0 10px;font-size:15px}
.adm .frm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm input,.adm select{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;min-width:0}
.adm .add{grid-column:1/-1;padding:10px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.adm ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.adm li{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:8px;font-size:14px}
.adm li .r{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.adm li button{margin-left:auto;color:var(--neg);font-size:13px;font-weight:600}
.row.locked .st,.row.locked .media,.row.locked .note,.row.locked .sebep,.row.locked .undo{opacity:.55;pointer-events:none}
.row.locked .audios,.row.locked .thumbs{opacity:1;pointer-events:auto}
.more{margin:12px auto 0;display:block;padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="hdr">
  <button class="back" id="back" hidden aria-label="Geri">‹</button>
  <h1 id="title">Tekel Saha<span class="sub" id="subtitle">İstanbul · 39 ilçe</span></h1>
</header>
<div class="tabs" id="tabs" role="tablist" hidden>
  <button class="tab" role="tab" id="tab-ilceler" aria-selected="true">İlçeler</button>
  <button class="tab" role="tab" id="tab-ziyaretler" aria-selected="false">Ziyaretler</button>
  <button class="tab" role="tab" id="tab-taktik" aria-selected="false">Satış Taktikleri</button>
</div>
<main>
  <div class="sync" id="sync">kayıtlar yükleniyor…</div>
  <div class="who" id="who" hidden><span><b id="whoName"></b> <span id="whoRol"></span></span><span><button id="whoAdmin" type="button" hidden>Kullanıcılar</button> · <button id="whoPass" type="button">Şifre</button> · <button id="whoOut" type="button">Çıkış</button></span></div>
  <div id="view"></div>
</main>

<script src="/saha/tk-llt6yveiiqsapk1mma/data.js"></script>
<script>
(function(){
  const DATA = window.TEKEL_DATA || [];
  const $ = (s,el=document)=>el.querySelector(s);
  const view = $('#view'), title=$('#title'), subtitle=$('#subtitle'), back=$('#back'), syncEl=$('#sync');
  const byIlce = Object.fromEntries(DATA.map(d=>[d.s,d]));
  const dealerIndex = {}; DATA.forEach(d=>d.k.forEach(k=>dealerIndex[k.i]={...k,ilce:d.s,ilceAd:d.n}));

  // ---- state: {ilceSlug: {dealerId: {d,n,t}}}
  let visits = {};
  const LS='tekel-saha-v1';
  try{ visits = JSON.parse(localStorage.getItem(LS)||'{}') || {}; }catch(e){ visits={}; }
  function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(visits)); }catch(e){} }

  const route = { tab:'ilceler', ilce:null, q:'', sort:'ad', filter:'hepsi', vf:'hepsi' };
  let myPos = null;

  function setSync(t,err){ syncEl.textContent=t; syncEl.classList.toggle('err',!!err); }

  // ---- sync: /api/saha/<token> (Supabase). localStorage çevrimdışı yedek.
  const API='/api/saha/tk-llt6yveiiqsapk1mma';
  let online=false;
  async function pull(){
    if(!authed) return;
    try{
      const r=await fetch(API,{cache:'no-store'}); if(r.status===401){ renderLogin('Oturum bitti, tekrar gir'); return; } if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); const merged={};
      for(const il in (j.ziyaret||{})) merged[il]={...j.ziyaret[il]};
      // cihazda olup sunucuda olmayanları (çevrimdışı işaretler) geri yükle
      const pendingIl=new Set();
      for(const il in visits){ if(!merged[il]) merged[il]={}; for(const id in visits[il]){ if(!merged[il][id]){ merged[il][id]=visits[il][id]; pendingIl.add(il);} } }
      visits=merged; online=true; saveLocal();
      setSync('kayıtlar bulutta · '+countAll()+' işaretli bayi');
      pendingIl.forEach(il=>persist(il));
      render();
    }catch(e){ online=false; setSync('bulut bağlantısı yok, cihazda kaydediliyor', true); render(); }
  }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); });

  const writeTimers = {};
  function persist(ilce){
    saveLocal();
    clearTimeout(writeTimers[ilce]);
    writeTimers[ilce] = setTimeout(async ()=>{
      try{
        const clean={}; for(const id in (visits[ilce]||{})){ const {_consent,...rest}=visits[ilce][id]; clean[id]=rest; }
        const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ilce,kayitlar:clean})});
        if(r.status===401){ renderLogin('Oturum bitti, tekrar gir'); return; }
        if(r.status===403){ const j=await r.json().catch(()=>({})); setSync(j.error||'Yetkin yok', true); pull(); return; }
        if(!r.ok) throw new Error('HTTP '+r.status);
        online=true; setSync('kayıtlar bulutta · '+countAll()+' işaretli bayi');
      }catch(e){ online=false; setSync('kayıt buluta yazılamadı · cihazda duruyor, bağlanınca gönderilir', true); }
    }, 600);
  }

  function countAll(){ let c=0; for(const il in visits) c+=Object.keys(visits[il]).length; return c; }
  function stats(ilce){ const v=visits[ilce]||{}; const s={olumlu:0,olumsuz:0,gidildi:0}; for(const id in v){ if(s[v[id].d]!=null) s[v[id].d]++; } return s; }

  function setStatus(ilce,id,k){
    if(!ilce) return;
    visits[ilce] = visits[ilce]||{};
    const cur = visits[ilce][id];
    if(k==='geri'){ if(cur&&((cur.foto&&cur.foto.length)||(cur.ses&&cur.ses.length))&&!confirm('Bu ziyaretin fotoğraf/ses kayıtları var. Yine de geri alınsın mı?')) return; delete visits[ilce][id]; }
    else if(k==='gidildi'){
      if(!cur){
        const r={ d:'gidildi', n:'', t:new Date().toISOString(), kim:rep, foto:[], ses:[] };
        visits[ilce][id]=r; persist(ilce); render();
        // konum: bayiye mesafe (150 m üstü bayrak)
        if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{
          const k2=dealerIndex[id]; if(!k2) return; const me={la:p.coords.latitude,ln:p.coords.longitude};
          const rr=(visits[ilce]||{})[id]; if(!rr) return;
          rr.konum={la:+me.la.toFixed(6),ln:+me.ln.toFixed(6),acc:Math.round(p.coords.accuracy||0),m:Math.round(dist(me,k2))};
          persist(ilce); render();
        }, ()=>{ const rr=(visits[ilce]||{})[id]; if(rr){ rr.konum={hata:'izin yok'}; persist(ilce); render(); } }, {enableHighAccuracy:true,timeout:12000,maximumAge:10000});
        return;
      }
    }
    else if(cur && cur.d===k){ visits[ilce][id] = { ...cur, d:'gidildi', sebep:undefined }; }
    else { visits[ilce][id] = { ...(cur||{}), d:k, n:(cur&&cur.n)||'', t:(cur&&cur.t)||new Date().toISOString(), tk:new Date().toISOString(), kim:(cur&&cur.kim)||rep }; }
    persist(ilce); render();
  }

  // ---- medya: yükleme + oynatma (özel bucket, token'lı API)
  const MEDIA=API+'/medya';
  const mediaUrl=path=>MEDIA+'?path='+encodeURIComponent(path);
  async function uploadMedia(blob,ilce,bayi,tur,ext){
    const fd=new FormData(); fd.append('dosya',blob,tur+'.'+ext); fd.append('ilce',ilce); fd.append('bayi',bayi); fd.append('tur',tur);
    const r=await fetch(MEDIA,{method:'POST',body:fd}); const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j.path;
  }
  function shrinkImage(file){ // 1280px JPEG; kamera fotoğrafı 3-8 MB olur, saha internetinde şişmesin
    return new Promise(res=>{ const img=new Image(); const u=URL.createObjectURL(file);
      img.onload=()=>{ const sc=Math.min(1,1280/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>res(b||file),'image/jpeg',.82); };
      img.onerror=()=>{ URL.revokeObjectURL(u); res(file); }; img.src=u; });
  }
  // kayıt
  let recState=null; // {mr, chunks, start, timer, ilce, id, tur}
  function pickMime(){ for(const m of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg']) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m; return ''; }
  async function startRec(ilce,id,tur,btn){
    if(recState){ setSync('Zaten bir kayıt sürüyor', true); return; }
    if(!navigator.mediaDevices||!window.MediaRecorder){ setSync('Bu tarayıcı ses kaydını desteklemiyor', true); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ setSync('Mikrofon izni verilmedi', true); return; }
    const mime=pickMime(); const mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); const chunks=[];
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    mr.onstop=async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const st=recState; recState=null; clearInterval(st.timer);
      const type=(mr.mimeType||mime||'audio/webm').split(';')[0]; const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
      const blob=new Blob(chunks,{type}); const sure=Math.round((Date.now()-st.start)/1000);
      if(sure<2){ setSync('Kayıt çok kısa, kaydedilmedi', true); render(); return; }
      setSync('ses yükleniyor… ('+Math.round(blob.size/1024)+' KB)');
      try{ const path=await uploadMedia(blob,st.ilce,st.id,st.tur,ext);
        const rec=(visits[st.ilce]||{})[st.id]; if(rec){ rec.ses=(rec.ses||[]).concat([{p:path,s:sure,tur:st.tur,t:new Date().toISOString(),riza:st.tur==='gorusme'}]); persist(st.ilce); }
        setSync('ses kaydı buluta yüklendi'); }
      catch(e){ setSync('ses yüklenemedi: '+e.message, true); }
      render();
    };
    mr.start(1000); recState={mr,chunks,start:Date.now(),ilce,id,tur,timer:null};
    recState.timer=setInterval(()=>{ const b=document.querySelector('[data-stop="'+id+'"]'); if(b){ const sn=Math.round((Date.now()-recState.start)/1000); b.textContent='⏹ Durdur · '+String(Math.floor(sn/60)).padStart(2,'0')+':'+String(sn%60).padStart(2,'0'); } },500);
    render();
  }
  function stopRec(){ if(recState&&recState.mr.state!=='inactive') recState.mr.stop(); }
  window.addEventListener('beforeunload',e=>{ if(recState){ e.preventDefault(); e.returnValue=''; } });

  const SEBEP=['Pahalı buldu','İlgilenmedi','Zaten benzer sistem var','Patron/sahibi yoktu','Alkol/yasal kaygı','Bilgisayar-telefon korkusu','Sonra gel dedi','Telefon siparişi almıyor','Diğer'];

  // ---- helpers
  const esc = s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const telHref = p=>{ const d=String(p||'').replace(/\D/g,''); return d? 'tel:+90'+d.replace(/^0/,'') : ''; };
  function dist(a,b){ const R=6371000,toR=Math.PI/180; const dLa=(b.la-a.la)*toR, dLn=(b.ln-a.ln)*toR; const h=Math.sin(dLa/2)**2+Math.cos(a.la*toR)*Math.cos(b.la*toR)*Math.sin(dLn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
  const fmtDist = m=> m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(1)+' km';

  function renderIlceler(){

  function dealerRow(k,rec,dm,ilceAd){

  function bindDealerRows(slug){
    view.querySelectorAll('.dealer').forEach(row=>{
      const id=row.dataset.id; const il = slug || (dealerIndex[id]&&dealerIndex[id].ilce);
      row.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>setStatus(il,id,b.dataset.k)));
      const rec=(visits[il]||{})[id];
      const foto=row.querySelector('[data-foto]');

        catch(e){ setSync('fotoğraf yüklenemedi: '+e.message, true); }
      });
      const c=row.querySelector('[data-consent]'); if(c) c.addEventListener('click',()=>{ rec._consent=true; render(); });
      const riza=row.querySelector('[data-riza]'), go=row.querySelector('[data-startrec]');
      if(riza&&go){ riza.addEventListener('change',()=>{ go.disabled=!riza.checked; }); go.addEventListener('click',()=>{ if(!riza.checked) return; delete rec._consent; rec.riza={t:new Date().toISOString(),kim:rep}; persist(il); startRec(il,id,'gorusme'); }); }
      const nr=row.querySelector('[data-notrec]'); if(nr) nr.addEventListener('click',()=>startRec(il,id,'not'));
      const sp=row.querySelector('[data-stop]'); if(sp) sp.addEventListener('click',stopRec);
      const sb=row.querySelector('[data-sebep]'); if(sb) sb.addEventListener('change',()=>{ rec.sebep=sb.value||undefined; persist(il); });
      const ta=row.querySelector('.note textarea'), sv=row.querySelector('.note .save'), ok=row.querySelector('.note .saved');
      if(ta && sv){
        const doSave=()=>{ setNote(il,id,ta.value.trim()); ok.hidden=false; sv.disabled=true; setTimeout(()=>{ ok.hidden=true; },2000); };
        sv.addEventListener('click',doSave);
        ta.addEventListener('input',()=>{ sv.disabled=false; ok.hidden=true; });
        ta.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); doSave(); } });
      }
    });
  }

  function locate(done, btn){
    if(!navigator.geolocation){ setSync('Bu cihazda konum servisi yok', true); return; }
    const label=btn?btn.textContent:''; if(btn) btn.textContent='📍 Konum alınıyor…';
    navigator.geolocation.getCurrentPosition(p=>{ myPos={la:p.coords.latitude,ln:p.coords.longitude,at:Date.now(),acc:p.coords.accuracy}; done(); },
      err=>{ if(btn) btn.textContent=label; setSync(err&&err.code===1?'Konum izni verilmedi — tarayıcı ayarlarından izin ver':'Konum alınamadı, tekrar dene', true); },
      {enableHighAccuracy:true,timeout:10000,maximumAge:15000});
  }
  let nearShown=50;
  function renderYakin(){
    back.hidden=false;
    title.firstChild.nodeValue='Yakınımdakiler';
    if(!myPos){ view.innerHTML='<div class="empty">Konum alınamadı</div>'; subtitle.textContent=''; return; }
    const all=[]; DATA.forEach(d=>d.k.forEach(k=>all.push({k,d,dm:dist(myPos,k)})));
    all.sort((a,b)=>a.dm-b.dm);
    let list=all; if(route.filter==='gidilmedi') list=all.filter(x=>!(visits[x.d.s]||{})[x.k.i]);
    const acc=myPos.acc?Math.round(myPos.acc):null;
    subtitle.textContent='tüm İstanbul · en yakın '+Math.min(nearShown,list.length)+' bayi'+(acc?' · konum ±'+acc+' m':'');
    let h='<div class="tools"><button class="chip" id="relocate">📍 Konumu yenile</button>'+
      '<button class="chip" data-filter="hepsi" aria-pressed="'+(route.filter!=='gidilmedi')+'">Hepsi</button>'+
      '<button class="chip" data-filter="gidilmedi" aria-pressed="'+(route.filter==='gidilmedi')+'">Gidilmedi</button></div>';
    h+='<div class="list">';
    list.slice(0,nearShown).forEach(({k,d,dm})=>{ h+=dealerRow(k,(visits[d.s]||{})[k.i],dm,d.n); });
    h+='</div>';
    if(list.length>nearShown) h+='<button class="more" id="more">50 bayi daha göster</button>';
    view.innerHTML=h;
    bindDealerRows(null);
    $('#relocate').addEventListener('click',()=>locate(()=>renderYakin(), $('#relocate')));
    view.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{ route.filter=b.dataset.filter; renderYakin(); }));
    const more=$('#more'); if(more) more.addEventListener('click',()=>{ nearShown+=50; renderYakin(); });
  }

  function renderZiyaretler(){
    title.firstChild.nodeValue='Ziyaretler';
    const rows=[]; for(const il in visits){ for(const id in visits[il]){ const k=dealerIndex[id]; if(k) rows.push({k,rec:visits[il][id]}); } }
    subtitle.textContent=rows.length+' işaretli bayi';
    const reps=[...new Set(rows.map(r=>r.rec.kim).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
    let h='<div class="tools">'+['hepsi','olumlu','olumsuz','gidildi'].map(f=>'<button class="chip" data-vf="'+f+'" aria-pressed="'+(route.vf===f)+'">'+(f==='hepsi'?'Hepsi':LABEL[f])+'</button>').join('')+
      '<button class="chip" data-vflag="1" aria-pressed="'+(!!route.vflag)+'">⚠ Konum uyuşmayan</button></div>';
    if(reps.length>1||route.vrep) h+='<div class="tools"><button class="chip" data-vrep="" aria-pressed="'+(!route.vrep)+'">Herkes</button>'+reps.map(n=>'<button class="chip" data-vrep="'+esc(n)+'" aria-pressed="'+(route.vrep===n)+'">👤 '+esc(n)+'</button>').join('')+'</div>';
    // red sebepleri özeti
    const neg=rows.filter(r=>r.rec.d==='olumsuz'); if(neg.length){ const cnt={}; neg.forEach(r=>{ const sb=r.rec.sebep||'Sebep girilmemiş'; cnt[sb]=(cnt[sb]||0)+1; });
      h+='<div class="step" style="padding:12px 14px"><h3 style="font-size:14px;margin-bottom:6px">Red sebepleri · '+neg.length+' olumsuz</h3><div class="meta" style="gap:6px 14px">'+Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<span><b>'+v+'</b> '+esc(k)+'</span>').join('')+'</div></div>'; }
    const list=rows.filter(r=>(route.vf==='hepsi'||r.rec.d===route.vf)&&(!route.vrep||r.rec.kim===route.vrep)&&(!route.vflag||(r.rec.konum&&(r.rec.konum.hata||r.rec.konum.m>150)))).sort((a,b)=>(b.rec.t||'').localeCompare(a.rec.t||''));
    if(!list.length){ h+='<div class="empty">Henüz işaretli bayi yok. İlçeler sekmesinden bir bayiyi Gidildi / Olumlu / Olumsuz olarak işaretle.</div>'; view.innerHTML=h; bindVf(); return; }
    let lastDay='', open=false;
    list.forEach(r=>{
      const day=(r.rec.t||'').slice(0,10);
      if(day!==lastDay){ lastDay=day; let lbl=day; try{ lbl=new Date(day+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}); }catch(e){} if(open) h+='</div>'; h+='<div class="grp">'+esc(lbl)+'</div><div class="list">'; open=true; }
      h+=dealerRow(r.k,r.rec,null,r.k.ilceAd).replace('<div class="acts">', ((r.rec.sebep?'<div class="quote"><b>Red sebebi:</b> '+esc(r.rec.sebep)+'</div>':'')+(r.rec.n?'<div class="quote">'+esc(r.rec.n)+'</div>':''))+'<div class="acts">');
    });
    if(open) h+='</div>';
    view.innerHTML=h; bindDealerRows(null); bindVf();
  }
  function bindVf(){
    view.querySelectorAll('[data-vf]').forEach(b=>b.addEventListener('click',()=>{ route.vf=b.dataset.vf; renderZiyaretler(); }));
    view.querySelectorAll('[data-vrep]').forEach(b=>b.addEventListener('click',()=>{ route.vrep=b.dataset.vrep||''; renderZiyaretler(); }));
    view.querySelectorAll('[data-vflag]').forEach(b=>b.addEventListener('click',()=>{ route.vflag=!route.vflag; renderZiyaretler(); }));
  }

  back.addEventListener('click',()=>{ route.tab='ilceler'; route.ilce=null; route.q=''; route.filter='hepsi'; route.sort='ad'; shown=80; window.scrollTo(0,0); render(); });

  $('#tab-ziyaretler').addEventListener('click',()=>{ route.tab='ziyaretler'; render(); });
  $('#tab-taktik').addEventListener('click',()=>{ route.tab='taktik'; window.scrollTo(0,0); render(); });
  whoami().then(ok=>{ if(ok){ render(); pull(); } });
})();
